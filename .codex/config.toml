# Project-local Codex configuration for the Scopegrain native pilot.
#
# MACHINE-LOCAL, NEVER VERSIONED: the mcp_servers.scopegrain entry embeds
# absolute paths (serverPath + --project). Regenerate per machine with:
#   scopegrain host activate --project . --host codex --apply
# and re-merge .scopegrain/integrations/codex-mcp.toml plus
# .scopegrain/integrations/native/codex/agents-fragment.toml into this file.
# This path is listed in .scopegrain/integrations/gitignore-proposal.txt.

# Merged from .scopegrain/integrations/codex-mcp.toml
[mcp_servers.scopegrain]
command = "node"
args = ["C:\\Users\\Eros\\VantaDB Proyect\\TaskSystem\\src\\mcp\\server.mjs", "--project", "C:\\Users\\Eros\\VantaDB Proyect\\TaskSystem", "--config", ".scopegrain/config.json"]

# Merged from .scopegrain/integrations/native/codex/agents-fragment.toml
[agents."scopegrain-requirements-analyst"]
description = "Clarify outcomes and falsifiable requirements without deciding product intent."
config_file = "agents/scopegrain-requirements-analyst.toml"

